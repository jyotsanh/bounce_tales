[package]
name = "bounce_tales"
version = "0.1.0"
edition = "2024"
default-run = "bounce_tales"

[dependencies]
directories = "6.0.0"
macroquad = { version = "0.4", features = ["audio"] }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
tiled = { version = "0.16", default-features = false }

[workspace]
members = ["tools/artgen"]
