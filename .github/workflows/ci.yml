# Checks every push and pull request on Linux, Windows and macOS: formatting
# (once), clippy with warnings as errors, and the whole test suite (unit
# tests, route replays through every chapter, level and robustness tests;
# the simulation is headless, so no display is needed).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Clippy and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries (X11, OpenGL, ALSA)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  deb:
    name: Linux package (.deb)
    # 22.04's older glibc lets the package run on more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev xvfb libgl1-mesa-dri desktop-file-utils
      - name: Build the package
        run: packaging/linux/build_deb.sh
      - name: Install it and run the game for a second
        run: |
          sudo apt-get install -y ./dist/*.deb
          xvfb-run -a bounce_tales --frames 60 --screenshot smoke.png
          test -s smoke.png
          desktop-file-validate /usr/share/applications/bounce_tales.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
          retention-days: 7

  windows:
    name: Windows installer + portable zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the zip and the installer
        run: packaging/windows/build_windows.ps1
      - name: Check the exe (icon and version info embedded, starts)
        run: |
          $exe = Get-Item target\release\bounce_tales.exe
          if ($exe.VersionInfo.ProductName -ne 'Bounce Tales') { throw "no version info: $($exe.VersionInfo | Out-String)" }
          # --help exits before opening a window (the runner has no GPU).
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--help' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
      - name: Install silently, check, uninstall
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Bounce Tales'
          if (-not (Test-Path "$dir\bounce_tales.exe")) { throw "not installed in $dir" }
          $menu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Bounce Tales\Bounce Tales.lnk'
          if (-not (Test-Path $menu)) { throw 'no Start-menu entry' }
          Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\bounce_tales.exe") { throw 'uninstall left the game behind' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          retention-days: 7
