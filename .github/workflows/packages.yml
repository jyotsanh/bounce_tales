# Builds and checks the three downloads; called by CI (every push) and by
# the release workflow (tags). Each job uploads its files as an artifact:
#   linux-deb  dist/bounce_tales-<version>-linux-amd64.deb
#   windows    dist/bounce_tales-<version>-windows-x64.zip and -setup.exe
#   macos-dmg  dist/bounce_tales-<version>-macos-universal.dmg
name: Packages

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  deb:
    name: Linux package (.deb)
    # 22.04's older glibc lets the package run on more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev xvfb libgl1-mesa-dri desktop-file-utils
      - name: Build the package
        run: packaging/linux/build_deb.sh
      - name: Install it and run the game for a second
        run: |
          sudo apt-get install -y ./dist/*.deb
          xvfb-run -a bounce_tales --frames 60 --screenshot smoke.png
          test -s smoke.png
          desktop-file-validate /usr/share/applications/bounce_tales.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
          retention-days: 7

  windows:
    name: Windows installer + portable zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the zip and the installer
        run: packaging/windows/build_windows.ps1
      - name: Check the exe (icon and version info embedded, starts)
        run: |
          $exe = Get-Item target\release\bounce_tales.exe
          if ($exe.VersionInfo.ProductName -ne 'Bounce Tales') { throw "no version info: $($exe.VersionInfo | Out-String)" }
          # --help exits before opening a window (the runner has no GPU).
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--help' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
      - name: Install silently, check, uninstall
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Bounce Tales'
          if (-not (Test-Path "$dir\bounce_tales.exe")) { throw "not installed in $dir" }
          $menu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Bounce Tales\Bounce Tales.lnk'
          if (-not (Test-Path $menu)) { throw 'no Start-menu entry' }
          Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\bounce_tales.exe") { throw 'uninstall left the game behind' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          retention-days: 7

  macos:
    name: macOS universal .dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build the app and the disk image
        run: packaging/macos/make_dmg.sh
      - name: Check the app bundle
        run: |
          bin="target/macos/Bounce Tales.app/Contents/MacOS/bounce_tales"
          lipo -archs "$bin" | grep -q x86_64
          lipo -archs "$bin" | grep -q arm64
          codesign --verify --deep "target/macos/Bounce Tales.app"
          test -s "target/macos/Bounce Tales.app/Contents/Resources/bounce_tales.icns"
      - name: Mount the disk image and start the game
        run: |
          dmg=$(ls dist/*.dmg)
          hdiutil attach "$dmg" -mountpoint /tmp/bt -nobrowse
          test -d "/tmp/bt/Bounce Tales.app"
          test -L /tmp/bt/Applications
          # --help exits before opening a window; try the Intel slice too.
          "/tmp/bt/Bounce Tales.app/Contents/MacOS/bounce_tales" --help
          if /usr/bin/pgrep -q oahd; then arch -x86_64 "/tmp/bt/Bounce Tales.app/Contents/MacOS/bounce_tales" --help; fi
          # Just after the game ran from it (Rosetta caches the Intel slice,
          # Spotlight indexes the new volume) the image can be briefly busy:
          # retry, then force. Cleanup only; the runner is thrown away.
          for i in 1 2 3 4 5; do
            hdiutil detach /tmp/bt && exit 0
            sleep 3
          done
          hdiutil detach /tmp/bt -force
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          retention-days: 7
